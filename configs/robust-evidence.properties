# Optional winsorized EWMA input on the existing bounded NYC baseline.
# cap=4 selected on training/validation only among none/4/6/8, not on test results.
step_ms=1800000
origin_ms=1404172800000
period=336
k=6
window=336
tau=4
clip=2
epsilon=auto
strategy=bounded
method=periodic
score_mode=ewma
evidence_span=12
